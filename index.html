<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050805">
<title>NIKITA HAL</title>
<style>
:root{--green:#39ff14;--dim:#78a875;--line:#17451b;--bg:#030603}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--green);font-family:"Courier New",monospace;padding:22px;text-shadow:0 0 5px #39ff1430}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,#00000022 4px);opacity:.45}
.app{width:min(100%,1050px);margin:0 auto;border:1px solid var(--green);padding:clamp(14px,3vw,28px);background:#030803;box-shadow:0 0 24px #39ff1415,inset 0 0 25px #39ff1408}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:13px;color:var(--dim);font-size:12px}
.top strong{color:var(--green);font-weight:normal}
.hero{text-align:center;padding:30px 0 24px}
.logo{font-size:clamp(48px,10vw,78px);letter-spacing:.18em;margin-left:.18em;font-weight:bold;text-shadow:0 0 8px var(--green),0 0 24px #39ff1470}
.subtitle{font-size:12px;letter-spacing:.22em;color:var(--dim);margin-top:8px}
.status{margin-top:18px;font-size:12px;color:var(--dim)}
.status b{color:var(--green);font-weight:normal}
.mic{margin-top:20px;width:68px;height:68px;border:1px solid var(--green);border-radius:0;background:#061006;color:var(--green);font:30px "Courier New";cursor:pointer;box-shadow:0 0 14px #39ff1420}
.mic:hover,.mic.listening{background:#123012;box-shadow:0 0 22px #39ff1460}
.mic.listening{animation:pulse 1s infinite}
.mic:disabled{opacity:.55;cursor:wait}
@keyframes pulse{50%{box-shadow:0 0 30px #39ff14a0}}
.hint{min-height:18px;margin-top:10px;font-size:11px;color:var(--dim)}
.command{display:flex;gap:8px;margin:8px 0 20px}
input{min-width:0;flex:1;background:#020502;border:1px solid var(--line);padding:13px;color:var(--green);font:14px "Courier New";outline:none}
input:focus{border-color:var(--green);box-shadow:0 0 10px #39ff1425}
input::placeholder{color:#557653}
button{font-family:inherit}
.send,.category{background:#061006;border:1px solid var(--line);color:var(--green);padding:10px 14px;cursor:pointer}
.send:hover,.category:hover,.category.active{border-color:var(--green);background:#102410}
.section-title{font-size:12px;color:var(--dim);border-bottom:1px dashed var(--line);padding:9px 0;margin:18px 0 12px}
.categories{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.category{font-size:11px;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.site{display:block;text-align:left;text-decoration:none;color:var(--green);border:1px solid var(--line);padding:12px;background:#050b05;min-height:62px;transition:.12s}
.site:hover{border-color:var(--green);background:#0c1a0c;transform:translateY(-1px)}
.site-name{font-size:13px}
.site-cat{font-size:10px;color:var(--dim);margin-top:6px}
.log{border:1px solid var(--line);background:#020502;padding:12px;min-height:90px;max-height:180px;overflow:auto;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--dim)}
.log .bright{color:var(--green)}
.footer{text-align:center;color:#456b43;font-size:10px;margin-top:22px;letter-spacing:.12em}
@media(max-width:520px){body{padding:8px}.app{padding:13px}.top{font-size:10px}.command{gap:5px}.send{padding:0 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<span><strong>● SYSTEM ONLINE</strong> / ЛОКАЛЬНЫЙ ИНТЕРФЕЙС</span>
<span>N.HAL // VERSION 2.0</span>
</header>

<section class="hero">
<div class="logo">N.HAL</div>
<div class="subtitle">PERSONAL ACCESS TERMINAL</div>
<div class="status">МИКРОФОН: <b id="micStatus">ОЖИДАНИЕ</b> · РЕЖИМ: <b>БЕЗ ОЗВУЧКИ</b></div>
<button class="mic" id="mic" type="button" title="Начать голосовой ввод">⌁</button>
<div class="hint" id="hint">НАЖМИ НА КНОПКУ И ПРОИЗНЕСИ КОМАНДУ</div>
</section>

<div class="section-title">[ ВВОД КОМАНДЫ ]</div>
<form class="command" id="commandForm">
<input id="commandInput" autocomplete="off" placeholder="Например: открой YouTube">
<button class="send" type="submit">ВЫПОЛНИТЬ</button>
</form>

<div class="section-title">[ КАТАЛОГ СЕТИ ]</div>
<nav class="categories" id="categories"></nav>
<section class="grid" id="sites"></section>

<div class="section-title">[ SYSTEM LOG ]</div>
<div class="log" id="log" aria-live="polite"></div>
<footer class="footer">NIKITA HAL · TEXT + VOICE INPUT · NO VOICE OUTPUT</footer>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const mic = $("mic");
const hint = $("hint");
const micStatus = $("micStatus");
const log = $("log");
const input = $("commandInput");

let recognition = null;
let listening = false;

const catalog = [
["Видео","YouTube","https://www.youtube.com/"],
["Видео","Twitch","https://www.twitch.tv/"],
["Видео","Кинопоиск","https://www.kinopoisk.ru/"],
["Видео","Netflix","https://www.netflix.com/"],
["Видео","Rutube","https://rutube.ru/"],
["Видео","VK Видео","https://vkvideo.ru/"],
["Музыка","Яндекс Музыка","https://music.yandex.ru/"],
["Музыка","SoundCloud","https://soundcloud.com/"],
["Музыка","Spotify","https://open.spotify.com/"],
["Музыка","Bandcamp","https://bandcamp.com/"],
["Музыка","Apple Music","https://music.apple.com/"],
["Музыка","Last.fm","https://www.last.fm/"],
["Музыка","FL Studio","https://www.image-line.com/"],
["Музыка","WhoSampled","https://www.whosampled.com/"],
["Общение","VK","https://vk.com/"],
["Общение","Telegram","https://web.telegram.org/"],
["Общение","Discord","https://discord.com/app"],
["Общение","Reddit","https://www.reddit.com/"],
["Общение","Pinterest","https://www.pinterest.com/"],
["Общение","Instagram","https://www.instagram.com/"],
["Общение","TikTok","https://www.tiktok.com/"],
["Общение","X","https://x.com/"],
["Игры","Steam","https://store.steampowered.com/"],
["Игры","Epic Games","https://store.epicgames.com/"],
["Игры","GOG","https://www.gog.com/"],
["Игры","Nexus Mods","https://www.nexusmods.com/"],
["Игры","Mod DB","https://www.moddb.com/"],
["Разработка","GitHub","https://github.com/"],
["Разработка","CodePen","https://codepen.io/"],
["Разработка","Stack Overflow","https://stackoverflow.com/"],
["Разработка","W3Schools","https://www.w3schools.com/"],
["Разработка","MDN","https://developer.mozilla.org/"],
["Разработка","Replit","https://replit.com/"],
["ИИ","ChatGPT","https://chatgpt.com/"],
["ИИ","Gemini","https://gemini.google.com/"],
["ИИ","Claude","https://claude.ai/"],
["ИИ","Hugging Face","https://huggingface.co/"],
["ИИ","Perplexity","https://www.perplexity.ai/"],
["Покупки","Ozon","https://www.ozon.ru/"],
["Покупки","Wildberries","https://www.wildberries.ru/"],
["Покупки","Avito","https://www.avito.ru/"],
["Покупки","AliExpress","https://aliexpress.com/"],
["Покупки","Яндекс Маркет","https://market.yandex.ru/"],
["Покупки","DNS","https://www.dns-shop.ru/"],
["Полезное","Google","https://www.google.com/"],
["Полезное","Яндекс","https://ya.ru/"],
["Полезное","Google Translate","https://translate.google.com/"],
["Полезное","Яндекс Карты","https://yandex.ru/maps/"],
["Полезное","Google Maps","https://maps.google.com/"],
["Полезное","Gmail","https://mail.google.com/"],
["Полезное","Яндекс Почта","https://mail.yandex.ru/"],
["Полезное","Google Drive","https://drive.google.com/"],
["Полезное","Яндекс Диск","https://disk.yandex.ru/"],
["Полезное","Wikipedia","https://ru.wikipedia.org/"],
["Полезное","Speedtest","https://www.speedtest.net/"],
["Полезное","Internet Archive","https://archive.org/"]
];

const categories = ["ВСЕ", ...new Set(catalog.map(item => item[0]))];
let activeCategory = "ВСЕ";

function addLog(message, bright=false) {
  const line = document.createElement("div");
  if (bright) line.className = "bright";
  line.textContent = message;
  log.appendChild(line);

  while (log.children.length > 80) {
    log.removeChild(log.firstChild);
  }

  log.scrollTop = log.scrollHeight;
}

function renderCategories() {
  const host = $("categories");
  host.replaceChildren();

  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "category" +
      (category === activeCategory ? " active" : "");

    button.textContent = category;
    button.type = "button";

    button.addEventListener("click", () => {
      activeCategory = category;
      renderCategories();
      renderSites();
    });

    host.appendChild(button);
  });
}

function renderSites(filter="") {
  const host = $("sites");
  host.replaceChildren();

  const query = filter.toLocaleLowerCase("ru");

  catalog.filter(([category,name]) =>
    (activeCategory === "ВСЕ" || category === activeCategory) &&
    (!query || (name+" "+category).toLocaleLowerCase("ru").includes(query))
  ).forEach(([category,name,url]) => {
    const link = document.createElement("a");

    link.className = "site";
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    const title = document.createElement("div");
    title.className = "site-name";
    title.textContent = "> " + name;

    const sub = document.createElement("div");
    sub.className = "site-cat";
    sub.textContent = category.toUpperCase();

    link.append(title,sub);
    host.appendChild(link);
  });
}

function openEntry(entry) {
  window.open(entry[2], "_blank", "noopener,noreferrer");
  addLog("[HAL] ОТКРЫВАЮ: " + entry[1], true);
}

function handleCommand(raw) {
  const command = raw.trim();
  if (!command) return;

  addLog("[YOU] " + command, true);

  const lower = command.toLocaleLowerCase("ru");

  if (/^(помощь|help|что умеешь|список команд)$/.test(lower)) {
    addLog("[HAL] КОМАНДЫ: «открой YouTube», «открой Telegram», «найди Steam». Можно также выбрать сайт в каталоге.");
    return;
  }

  if (/^(привет|здравствуй|привет hal|привет хал)$/.test(lower)) {
    addLog("[HAL] СИСТЕМА НА СВЯЗИ. ЖДУ КОМАНДУ.", true);
    return;
  }

  const cleaned = lower.replace(
    /^(пожалуйста\s+)?(открой|открыть|запусти|запустить|перейди на|зайди на|найди|найти)\s+/,
    ""
  ).trim();

  const match = catalog.find(([category,name]) =>
    name.toLocaleLowerCase("ru") === cleaned ||
    name.toLocaleLowerCase("ru").includes(cleaned) ||
    cleaned.includes(name.toLocaleLowerCase("ru"))
  );

  if (match) {
    openEntry(match);
    return;
  }

  if (cleaned) {
    const found = catalog.filter(([category,name]) =>
      (name+" "+category).toLocaleLowerCase("ru").includes(cleaned)
    );

    if (found.length === 1) {
      openEntry(found[0]);
      return;
    }

    if (found.length > 1) {
      activeCategory = "ВСЕ";
      renderCategories();
      renderSites(cleaned);
      addLog("[HAL] НАЙДЕНО СОВПАДЕНИЙ: " + found.length + ". ВЫБЕРИ НУЖНЫЙ САЙТ.");
      return;
    }
  }

  addLog("[HAL] КОМАНДА НЕ РАСПОЗНАНА. НАПИШИ «ПОМОЩЬ».");
}

$("commandForm").addEventListener("submit", event => {
  event.preventDefault();
  handleCommand(input.value);
  input.value = "";
});

function stopListening() {
  listening = false;
  mic.disabled = false;
  mic.classList.remove("listening");
  micStatus.textContent = "ОЖИДАНИЕ";

  if (hint.textContent === "СЛУШАЮ...") {
    hint.textContent = "НАЖМИ НА КНОПКУ И ПРОИЗНЕСИ КОМАНДУ";
  }
}

mic.addEventListener("click", async () => {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    hint.textContent = "НЕТ ПОДДЕРЖКИ РАСПОЗНАВАНИЯ";
    addLog("[ERROR] ОТКРОЙ САЙТ В CHROME ИЛИ EDGE.");
    return;
  }

  if (listening && recognition) {
    recognition.stop();
    return;
  }

  try {
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("MIC_PERMISSION");
    }

    const stream =
      await navigator.mediaDevices.getUserMedia({audio:true});

    stream.getTracks().forEach(track => track.stop());

    recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;

    recognition.onstart = () => {
      listening = true;
      mic.classList.add("listening");
      micStatus.textContent = "СЛУШАЮ";
      hint.textContent = "СЛУШАЮ...";
      addLog("[HAL] МИКРОФОН АКТИВЕН. ГОВОРИ КОМАНДУ.", true);
    };

    recognition.onresult = event => {
      let transcript = "";

      for (let i=event.resultIndex; i<event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }

      hint.textContent = transcript
        ? "РАСПОЗНАНО: " + transcript
        : "СЛУШАЮ...";

      if (event.results[event.results.length-1].isFinal) {
        input.value = transcript.trim();
        handleCommand(transcript);
      }
    };

    recognition.onerror = event => {
      addLog("[ERROR] РАСПОЗНАВАНИЕ: " + event.error);
      hint.textContent = "ОШИБКА РАСПОЗНАВАНИЯ";
    };

    recognition.onend = stopListening;
    recognition.start();

  } catch(error) {
    stopListening();

    if (error.name === "NotAllowedError" ||
        error.message === "MIC_PERMISSION") {
      hint.textContent = "НЕТ ДОСТУПА К МИКРОФОНУ";
      addLog("[ERROR] РАЗРЕШИ БРАУЗЕРУ ИСПОЛЬЗОВАТЬ МИКРОФОН.");
    } else {
      hint.textContent = "НЕ УДАЛОСЬ ЗАПУСТИТЬ МИКРОФОН";
      addLog("[ERROR] " + error.message);
    }
  }
});

renderCategories();
renderSites();

addLog("[SYSTEM] N.HAL v2.0 ЗАГРУЖЕН.", true);
addLog("[SYSTEM] ГОЛОСОВОЙ ВВОД ВКЛЮЧЁН. ОЗВУЧКА ОТВЕТОВ ОТКЛЮЧЕНА.");
addLog("[SYSTEM] ДОСТУПНО САЙТОВ: " + catalog.length + ". НАПИШИ «ПОМОЩЬ».");
</script>
</body>
</html>
